[global]
# Either "production", "development"
mode = production

[server]
# Protocol (http, https, socket)
protocol = https

# The ip address to bind to, "0.0.0.0" will bind to all interfaces
http_addr = 0.0.0.0

# The http port to bind to
http_port = 8080

# The domain name used to access ezBookkeeping
# This will be your Cloud Run URL or custom domain
domain = ${SERVER_DOMAIN}

# The full url used to access ezBookkeeping in browser, supports placeholders: %(protocol)s, %(domain)s, %(http_port)s
root_url = %(protocol)s://%(domain)s/

# https certification and its key file (Cloud Run handles HTTPS termination)
cert_file =
cert_key_file =

# Unix socket path, for "socket" protocol only
unix_socket =

# Static file root path (relative or absolute path)
static_root_path = public

# Enable GZip compression for better performance
enable_gzip = true

# Set to true to log each request and execution time
log_request = false

# Add X-Request-Id header to response to track user request or error, default is true
request_id_header = true

[mcp]
# Set to true to enable MCP (Model Context Protocol) server (via http / https web server) for AI/LLM access
enable_mcp = false

# MCP server allowed remote IPs, a comma-separated list of allowed remote IPs
mcp_allowed_remote_ips =

[database]
# Either "mysql", "postgres" or "sqlite3"
type = postgres

# Database connection configuration for Neon PostgreSQL
# Use environment variables for sensitive credentials
host = ${NEON_HOST}:5432
name = ${NEON_DBNAME}
user = ${NEON_USER}
passwd = ${NEON_PASSWORD}

# For PostgreSQL, either "disable", "require" or "verify-full"
# Neon requires SSL/TLS, so use "require"
ssl_mode = require

# Connection pool settings optimized for Cloud Run
# Cloud Run typically runs 1-10 instances, so keep pool size moderate
max_idle_conn = 3
max_open_conn = 10
conn_max_lifetime = 1800

# Set to true to log each sql statement and execution time
log_query = false

# Set to true to automatically update database structure when starting web server
auto_update_database = true

[mail]
# Set to true to enable sending mail by SMTP server
enable_smtp = false

# SMTP Server connection configuration
smtp_host = 127.0.0.1:25
smtp_user =
smtp_passwd =
smtp_skip_tls_verify = false

# Mail from address. This can be just an email address, or the "Name" <user@domain.com> format.
from_address =

[log]
# Either "console", "file", default is "console"
# For Cloud Run, use console only (Cloud Logging handles file storage)
mode = console

# Either "debug", "info", "warn", "error", default is "info"
level = info

# For "file" mode only, log file path (relative or absolute path)
log_path = log/ezbookkeeping.log

[storage]
# File storage type: "local", "minio" or "webdav"
type = local

# For "local" storage only, file storage root path (relative or absolute path)
local_path = storage

# For "minio" storage, MinIO connection configuration
minio_endpoint =
minio_access_key =
minio_secret_key =
minio_use_ssl = true
minio_bucket =

# For "webdav" storage, WebDAV connection configuration
webdav_endpoint =
webdav_user =
webdav_passwd =
webdav_path =

[user]
# Whether to enable user registration
enable_registration = true

# Whether to force users to verify email when registering
require_email_verification = false

[security]
# JWT secret key (should be a long random string in production)
# This is used for session tokens and should be kept secret
jwt_secret = ${JWT_SECRET}

# Password hash algorithm salt rounds
password_salt_rounds = 10

# Enable CORS (Cross-Origin Resource Sharing)
enable_cors = true

# CORS allowed origins (comma-separated, use * for any)
cors_allowed_origins = *

# Rate limiting (requests per minute per IP)
rate_limit_per_minute = 60

[oauth]
# Enable OAuth 2.0 and OIDC support
enable_oauth = false

# OAuth configuration (leave blank if not using)
oauth_providers =

[timezone]
# Default timezone for new users
default_timezone = UTC

[feature]
# Enable experimental features
enable_experimental = false
